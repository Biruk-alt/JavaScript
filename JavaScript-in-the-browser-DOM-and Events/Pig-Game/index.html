
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Caveat:wght@400..700&family=Indie+Flower&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Julius+Sans+One&family=Libre+Baskerville:ital,wght@0,400..700;1,400..700&family=Lobster&family=Lobster+Two:ital,wght@0,400;0,700;1,400;1,700&family=Montenegrin+Gothic+One&family=Nunito:ital,wght@0,200..1000;1,200..1000&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Press+Start+2P&family=Sono:wght,MONO@200..800,1&family=Unbounded:wght@200..900&display=swap" rel="stylesheet">
<body>  
    <section class="main">
        <div class="player-0 container active-player">
            <h1>Player 1</h1>
            <p class="score-0">20</p>
            <div class="small-box">
                <h2>Current</h2>
                <p class="currentscore0">0</p>
            </div>
        </div>

        <div class="player-1 container">
            <h1>Player 2</h1>
            <p class="score-1">20</p>
            <div class="small-box">
                <h2>Current</h2>
                <p class="currentscore1">20</p>
            </div>
        </div>

        <img src="" class="dice">
        <button class="btn btn-new">🔄 New game</button>
        <button class="btn btn-roll">🎲 Roll dice</button>
        <button class="btn btn-hold">📥 Hold</button>
    </section>
<script src="script.js"></script>
</body>
</html>
