<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="style.css">
    <script defer src="script.js"></script>
</head>
<body>
    <div class="tracker-container">
        <header>
            <h1>Expense Tracker</h1>
            <div class="balance-card">
                <h2>Total Expenses</h2>
                <p id="total-amount">$0.00</p>
            </div>
        </header>

        <main>
            <form id="expense-form">
                <div class="form-group">
                    <label for="description">Description</label>
                    <input type="text" id="description" placeholder="e.g., Coffee, Groceries" required>
                </div>
                <div class="form-group">
                    <label for="amount">Amount ($)</label>
                    <input type="number" id="amount" step="0.01" min="0.01" placeholder="0.00" required>
                </div>
                <button type="submit" class="btn-submit">Add Expense</button>
            </form>

            <section class="expense-list-section">
                <h3>History</h3>
                <ul id="expense-list">
                    <!-- Dynamic items will be injected here -->
                </ul>
                <p id="empty-state" class="empty-state">No expenses added yet.</p>
            </section>
        </main>
    </div>

   
</body>
</html>
